[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqxf"
version = "0.1.0"
description = "Forex strategy factory: causal evaluator, genetic generator, stress funnel, library and portfolio engine"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pandas>=2.2", "pyarrow>=15", "numba>=0.60", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sqxf = "sqxf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests"]
markers = ["data: needs data/raw CSVs (skipped if absent)", "slow: longer tests"]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
